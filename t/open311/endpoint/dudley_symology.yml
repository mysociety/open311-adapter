  RoadDamage:
    name: Road Damage
    parameters:
      RequestType: CWPH
      AnalysisCode2: CWD
    logic:
      - rules: [ $attr.damage_cause, Tree root damage ]
        output:
          AnalysisCode2: ROOT
    questions:
      - code: contractors
        description: If you are aware of any contractors working on site, please give details
        required: false
      - code: damage_cause
        description: What has caused the damage?
        values:
          - Deterioration
          - Tree root damage
          - Traffic accident damage
          - Other

  FootpathDamage:
    name: Footpath Damage
    parameters:
      RequestType: FWPH
      AnalysisCode2: FWD
    logic:
      - rules: [ $attr.damage_cause, Tree root damage ]
        output:
          AnalysisCode2: ROOT
    questions:
      - code: contractors
        description: If you are aware of any contractors working on site, please give details
        required: false
      - code: damage_cause
        description: What has caused the damage?
        values:
          - Deterioration
          - Tree root damage
          - Traffic accident damage
          - Other

  KerbstoneDamage:
    name: Kerbstone Damage
    parameters:
      RequestType: KDM
      AnalysisCode2: DKER
    questions:
      - code: damage_type
        description: What is the Kerbstone Damage?
        values:
          - Kerbstone dislodged in road
          - Kerbstone dislodged in footpath
          - Cracked
          - Damaged by a vehicle
          - Other

